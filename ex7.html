
<!DOCTYPE html>
<html>
<head>
  <title>Navigation Menu </title>
  <style>
    
    .nav-container {
      background-color: #f7f7f5;
      padding: 10px;
    }

    
    .nav-block {
      background-color: #c17878;
      color: white;
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
      display: block; 
    }

    
    .nav-inline {
      color: white;
      background-color: #4cb6bc;
      padding: 8px;
      display: inline;
    }

    
    .nav-inline-block {
      background-color: #a659b3;
      color: white;
      padding: 8px;
      width: 120px;
      height: 30px;
      margin-right: 10px;
      text-align: center;
      display: inline-block; 
    }

    
    .nav-float-left {
      float: left; 
      background-color: #6e7ebb;
      color: white;
      width: 100px;
      height: 40px;
      line-height: 40px;
      text-align: center;
      margin-right: 10px;
    }

    
    .clear-float {
      clear: both; 
    }
  </style>
</head>
<body>

  <h2>Navigation Menu</h2>

  <div class="nav-container">

    <div class="nav-block">Block Element (Full width)</div><br></br>

    <span class="nav-inline">HOME</span>
    <span class="nav-inline">ABOUT</span>
    <span class="nav-inline">CONTACT</span><br></br>

    <br></br>

    <div class="nav-inline-block">ADMISSION</div>
    <div class="nav-inline-block">ACADEMICS</div>
    <div class="nav-inline-block">PLACEMENTS</div>
    <br></br>

    <br style="clear: both;">

    <div class="nav-float-left">CLUBS</div>
    <div class="nav-float-left">EVENTS</div>
    <div class="nav-float-left">CAMPUS</div><br></br>

    <div class="clear-float"></div>

  </div>

</body>
</html>
